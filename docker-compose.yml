name: fauzi-portfolio

services:
  api:
    build:
      context: .
      target: app
    container_name: portfolio-api
    restart: unless-stopped
    networks:
      service_network:
        aliases:
          - portfolio-api
          - api
      database_network:
      project_network:
        aliases:
          - portfolio-api
          - api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-5}
      PORT: 3001
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: "true"
      API_BODY_LIMIT_BYTES: ${API_BODY_LIMIT_BYTES:-6291456}
      CORS_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://seaweedfs:8333}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-portfolio}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-portfolio}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-portfolio-secret-change-me}
      S3_FORCE_PATH_STYLE: "true"
      S3_PUBLIC_URL: ${PUBLIC_ORIGIN:-http://localhost}/s3/${S3_BUCKET:-portfolio}
    command: >
      sh -c "pnpm --filter @portfolio/api db:migrate &&
             until pnpm --filter @portfolio/api storage:setup; do sleep 2; done &&
             pnpm --filter @portfolio/api db:seed &&
             pnpm --filter @portfolio/api start"

networks:
  service_network:
    external: true
    name: ${SERVICE_NETWORK:-service_service_network}
  database_network:
    external: true
    name: ${DATABASE_NETWORK:-database_database_network}
  project_network:
    external: true
    name: ${PROJECT_NETWORK:-project_network}
